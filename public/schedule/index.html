<style>
  /* Tom Ford direction (concept) — Category of One Branding guidelines, applied to Re Perez */
  :root{--black:#000;--bone:#F9F8F3;--khaki:#8C8164;--charcoal:#4C4E4A;--gold:#D8C59C;--white:#fff;
        --hair-d:rgba(255,255,255,.14);--hair-l:rgba(0,0,0,.14);}
  *{margin:0;padding:0;box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{background:var(--black);color:var(--white);font-family:"Montserrat",system-ui,sans-serif;font-weight:300;font-size:18px;line-height:1.7;-webkit-font-smoothing:antialiased;}
  img{display:block;max-width:100%;}
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:1240px;margin:0 auto;padding:0 56px;}
  h1,h2{font-weight:800;text-transform:uppercase;letter-spacing:-.045em;line-height:.9;}
  .one{color:var(--khaki);}
  .eyebrow{display:block;font-size:11.5px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--khaki);}

  /* NAV */
  .nav{position:sticky;top:0;z-index:20;background:var(--black);border-bottom:1px solid var(--hair-d);}
  .nav .wrap{display:flex;align-items:center;justify-content:center;height:92px;}
  .nav img{height:26px;width:auto;}

  /* HERO — light rays, hero only */
  .hero{position:relative;overflow:hidden;text-align:center;padding:clamp(64px,9vh,120px) 0 clamp(56px,7vh,100px);border-bottom:1px solid var(--hair-d);}
  .hero::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-conic-gradient(from 0deg at 50% 118%,rgba(216,197,156,.13) 0deg .14deg,transparent .14deg 2.2deg);
    -webkit-mask-image:radial-gradient(120% 95% at 50% 118%,#000 15%,rgba(0,0,0,.55) 55%,transparent 88%);mask-image:radial-gradient(120% 95% at 50% 118%,#000 15%,rgba(0,0,0,.55) 55%,transparent 88%);}
  .hero .wrap{position:relative;}
  .hero .hero-eb{margin-bottom:30px;font-size:14px;color:var(--white);letter-spacing:.26em;}
  .hero h1{font-size:96px;}
  .hero .lede{font-size:21px;line-height:1.6;color:rgba(255,255,255,.86);margin:38px auto 46px;}
  .hero .lede span{display:block;}
  .btn{display:inline-block;background:var(--khaki);color:var(--white);font-size:12px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;padding:18px 34px;border:1px solid var(--khaki);transition:background .2s,color .2s,border-color .2s;}
  .btn:hover{background:var(--white);color:var(--black);border-color:var(--white);}

  /* RESULTS */
  .results .wrap{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));}
  .stat{text-align:center;padding:44px 20px;}
  .stat+.stat{border-left:1px solid var(--hair-d);}
  .stat .n{font-size:64px;font-weight:800;letter-spacing:-.045em;line-height:1;}
  .stat .l{font-size:11px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,255,255,.62);margin-top:18px;}

  /* TESTIMONIALS — featured long-form (alternating bone/black), quote strip, In Their Words wall */
  .thead{text-align:center;margin-bottom:96px;}
  .thead h2,.whead h2{font-size:78px;margin-top:22px;}
  .feat{padding:130px 0;}
  .feat.bone{background:var(--bone);color:var(--black);}
  .feat.dark{background:var(--black);color:var(--white);border-top:1px solid var(--hair-d);}
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:96px;align-items:start;}
  .feat.flip .lead{order:2;}
  .mk{display:block;font-size:110px;font-weight:800;line-height:.7;color:var(--khaki);height:56px;}
  .big{font-size:44px;font-weight:800;text-transform:uppercase;letter-spacing:-.03em;line-height:.98;margin:22px 0 40px;}
  .big em{font-style:normal;color:var(--khaki);}
  .feat .body p{font-size:17px;font-weight:300;line-height:1.75;margin-bottom:20px;}
  .feat.bone .body p{color:#1a1a1a;}
  .feat.dark .body p{color:rgba(255,255,255,.82);}
  .res{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--khaki);border:1px solid var(--khaki);padding:7px 12px;margin-bottom:24px;}
  .who{display:flex;align-items:center;gap:18px;}
  .avi{flex:0 0 56px;width:56px;height:56px;border-radius:50%;object-fit:cover;filter:grayscale(1);}
  .ini{background:#E8E6DF;color:var(--charcoal);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;letter-spacing:.08em;}
  .nm{font-size:12px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;line-height:1.5;}
  .ti{font-size:15px;font-weight:300;line-height:1.5;margin-top:2px;opacity:.62;}
  .strip{background:var(--charcoal);overflow:hidden;padding:30px 0;white-space:nowrap;}
  .strip .track{display:inline-flex;gap:72px;animation:tick 70s linear infinite;}
  .strip span{font-size:22px;font-weight:600;color:var(--white);letter-spacing:-.01em;}
  .strip i{font-style:normal;font-size:11px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-left:20px;}
  @keyframes tick{to{transform:translateX(-50%);}}
  @media(prefers-reduced-motion:reduce){.strip .track{animation:none;}}
  .wall{background:var(--bone);color:var(--black);padding:130px 0 70px;}
  .whead{text-align:center;margin-bottom:84px;}
  .cols{column-count:3;column-gap:56px;}
  .c{break-inside:avoid;border-top:1px solid var(--khaki);padding:34px 0 64px;display:block;}
  .c blockquote p{font-size:16px;font-weight:300;line-height:1.7;color:#1a1a1a;margin-bottom:28px;}
  .c.S blockquote p{font-size:22px;font-weight:600;line-height:1.35;letter-spacing:-.01em;color:#000;}
  /* FOOTER */
  footer .top{display:flex;justify-content:space-between;align-items:flex-end;gap:40px;padding:84px 0 64px;}
  footer .top img{height:40px;width:auto;}
  footer .desc{text-align:right;font-size:26px;font-weight:300;line-height:1.45;}
  footer .desc span{display:block;}
  footer .desc span+span{color:var(--gold);}
  footer .role{font-size:11.5px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:#fff;line-height:1.9;margin-top:26px;}
  footer .role span{display:block;}
  footer .social{display:flex;gap:14px;}
  footer .social a{width:48px;height:48px;border:1px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;color:#fff;transition:background .2s,color .2s,border-color .2s;}
  footer .social a:hover{background:#fff;color:#000;border-color:#fff;}
  footer .social svg{width:20px;height:20px;}
  footer .bot{border-top:1px solid var(--hair-d);padding:26px 0 44px;font-size:11.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#fff;}

  /* ---- mobile ---- */
  @media(max-width:900px){
    .wrap{padding:0 24px;}
    .nav .wrap{height:72px;} .nav img{height:22px;}
    .hero{padding:52px 0 46px;}
    .hero h1{font-size:44px;}
    .hero .hero-eb{font-size:12px;letter-spacing:.2em;line-height:1.9;margin-bottom:22px;}
    .hero .hero-eb .br{display:block;}
    .hero .lede{font-size:17px;margin:22px auto 28px;}
    .btn{display:block;width:100%;max-width:380px;margin:0 auto;padding:18px 12px;font-size:11.5px;letter-spacing:.16em;}
    .results .wrap{padding:0;}
    .stat{padding:28px 8px;}
    .stat .n{font-size:34px;}
    .stat .l span{display:block;}
    .stat .l{font-size:9px;letter-spacing:.14em;line-height:1.5;margin-top:12px;}
    .feat{padding:90px 0;}
    .thead{margin-bottom:56px;}
    .thead h2,.whead h2{font-size:38px;}
    .fgrid{grid-template-columns:1fr;gap:40px;}
    .feat.flip .lead{order:0;}
    .mk{font-size:84px;height:42px;}
    .big{font-size:30px;margin:18px 0 30px;}
    .feat .body p{font-size:16px;}
    .strip{padding:22px 0;} .strip span{font-size:18px;} .strip .track{gap:48px;}
    .wall{padding:90px 0;}
    .whead{margin-bottom:48px;}
    .cols{column-count:1;}
    .c{padding:30px 0 48px;}
    .c.S blockquote p{font-size:20px;}
    footer .top{flex-direction:column;align-items:flex-start;gap:34px;padding:64px 0 44px;}
    footer .role{font-size:10.5px;letter-spacing:.2em;margin-top:22px;}
    footer .top img{height:30px;}
    footer .desc{text-align:left;font-size:17px;}
    footer .bot{font-size:10.5px;letter-spacing:.16em;}
  }
  /* hero button: black with white outline (approved option B) */
  .hero .btn{background:#000;border-color:#fff;color:#fff;}
  .hero .btn:hover{background:#fff;color:#000;}
  @media(max-width:380px){.hero .lede{font-size:15.5px;}}
  /* keep the proof points above the fold on short laptop screens and small phones */
  @media(min-width:901px) and (max-height:820px){
    .hero{padding:48px 0 40px;} .hero h1{font-size:80px;} .hero .hero-eb{margin-bottom:22px;}
    .hero .lede{margin:26px auto 32px;} .stat{padding:34px 20px;}
  }
  @media(max-width:900px) and (max-height:700px){
    .hero{padding:36px 0 32px;} .hero h1{font-size:38px;} .hero .lede{margin:18px auto 22px;} .stat{padding:22px 8px;}
  }
  /* closing CTA band (khaki, per guidelines) */
  html{scroll-behavior:smooth;}
  #testimonials{scroll-margin-top:92px;}
  .cta{text-align:center;padding:130px 0;background:var(--khaki);color:#fff;}
  .cta .eyebrow{color:#fff;}
  .cta h2{font-size:78px;margin:22px auto 0;}
  .cta .lede{font-size:21px;line-height:1.6;max-width:44ch;margin:34px auto 46px;color:rgba(255,255,255,.9);}
  .cta .btn{background:#000;border-color:#000;color:#fff;}
  .cta .btn:hover{background:#fff;border-color:#fff;color:#000;}
  @media(max-width:900px){#testimonials{scroll-margin-top:72px;} .cta{padding:90px 0;} .cta h2{font-size:34px;} .cta .lede{font-size:17px;margin:24px auto 32px;}}

  /* SCHEDULE */
  .sched{text-align:center;padding:110px 0 130px;}
  .sched h1{font-size:78px;margin:22px 0 0;}
  .sched .lede{font-size:19px;line-height:1.7;color:rgba(255,255,255,.86);max-width:58ch;margin:30px auto 48px;}
  .tabs{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:32px;}
  .tab{font-family:inherit;font-size:12px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:#fff;background:#000;border:1px solid rgba(255,255,255,.35);padding:17px 30px;cursor:pointer;transition:background .2s,color .2s,border-color .2s;}
  .tab:hover{border-color:#fff;}
  .tab.active{background:#fff;color:#000;border-color:#fff;}
  .cal{max-width:900px;margin:0 auto;background:#fff;padding:18px;}
  .cal-panel[hidden]{display:none;}
  .cal-panel iframe{width:100%;height:650px;border:0;display:block;}
  .note{margin-top:22px;font-size:13px;color:rgba(255,255,255,.6);}
  .note a{color:#fff;border-bottom:1px solid rgba(255,255,255,.4);}
  @media(max-width:900px){
    .sched{padding:64px 0 90px;}
    .sched h1{font-size:38px;}
    .sched .lede{font-size:16px;margin:22px auto 32px;}
    .tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:420px;margin:0 auto 24px;}
    .tab{padding:16px 8px;font-size:11.5px;letter-spacing:.16em;}
    .cal{padding:8px;margin:0 -12px;}
    .cal-panel iframe{height:720px;}
  }
</style>
</head>
<body>

  <header class="nav"><div class="wrap">
    <a href="/"><img src="/assets/RePerez_horizontal_white-perezkhaki.svg" alt="Re Perez"></a>
  </div></header>

  <main class="sched"><div class="wrap">
    <span class="eyebrow">Book a Call</span>
    <h1>Schedule a Call</h1>
    <p class="lede">Please choose the session length that fits, then pick a time that works for you. I kindly ask for at least 24 hours&rsquo; notice if you need to reschedule.</p>
    <div class="tabs" role="tablist">
      <button class="tab active" data-cal="cal15">15 Minutes</button>

      <button class="tab" data-cal="cal60">60 Minutes</button>

    <div class="cal">

      <div class="cal-panel" id="cal30" hidden><iframe title="Book a 30-minute call" src="https://calendar.google.com/calendar/appointments/schedules/AcZssZ3w7VEE09qwK5ISjfNefMu15M1Z_LqDXsKY0_f5lJgVWDf_3-aDMMKbZo0-koCYaOUES8defu6p?gv=true" loading="lazy"></iframe></div>
      <div class="cal-panel" id="cal60" hidden><iframe title="Book a 60-minute call" src="https://calendar.google.com/calendar/appointments/schedules/AcZssZ2_6ZdaHPBJYc_760m6ofgY4ye7l7QguCzkeVqfN5kXoz3ZkzQzwYQv77NO9M4j1VOaqNxDAV6B?gv=true" loading="lazy"></iframe></div>
      <div class="cal-panel" id="cal90" hidden><iframe title="Book a 90-minute call" src="https://calendar.google.com/calendar/appointments/schedules/AcZssZ26nuqRCoW7wtIaZ3hOOJ2a2eLCIVSZ3P9oGvDW2NmcFbLw8YXKU0KfZeLnd6a8wPKOg7BpJdvS?gv=true" loading="lazy"></iframe></div>
    </div>
  </div></main>

  <footer><div class="wrap">
    <div class="top">
      <div class="brand"><a href="/"><img src="/assets/RePerez_horizontal_white-perezkhaki.svg" alt="Re Perez"></a><p class="role">Global Brand Strategist <span>for Founder-Led B2B Businesses</span></p></div>
      <nav class="social" aria-label="Social">
        <a href="https://www.linkedin.com/in/re-perez-branding" target="_blank" rel="noopener" aria-label="Re Perez on LinkedIn"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9.75h4v11H3zM9.5 9.75h3.8v1.5h.06c.53-1 1.83-2.05 3.77-2.05 4.03 0 4.77 2.65 4.77 6.1v5.45h-4v-4.83c0-1.15-.02-2.64-1.61-2.64-1.61 0-1.86 1.26-1.86 2.56v4.91h-4z"/></svg></a>
        <a href="https://www.instagram.com/the.re.perez/" target="_blank" rel="noopener" aria-label="Re Perez on Instagram"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="17.4" cy="6.6" r="1.1" fill="currentColor"/></svg></a>
      </nav>
    </div>
    <div class="bot">&copy; 2026 Re Perez. All Rights Reserved.</div>
  </div></footer>

<script>
  document.querySelectorAll('.tab').forEach(function(b){b.addEventListener('click',function(){
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active');});
    document.querySelectorAll('.cal-panel').forEach(function(p){p.hidden=true;});
    b.classList.add('active');document.getElementById(b.dataset.cal).hidden=false;});});
</script>
